name: kanban-worktree-carryover
version: 1.2.0
kind: backend
author: Agent Smith (WeRoll fleet), 2026-09-14
description: >-
  A retry must never be handed a worktree cut from base while the card's own
  earlier branch — holding the implementation its reviewer already read —
  still exists in another local clone.

  The defect (t_b7585516, from the t_ae9459c0 overwatch): the dispatcher
  materialises a worktree card at `<repo>/.worktrees/<task-id>` and reuses the
  task's existing branch when it is present. That reuse is correct and is why
  an ordinary retry does keep its commits. It breaks when the card's resolved
  repo CHANGES between runs: on 2026-09-14 a live card's hardcoded
  workspace_path was cleared (the standard "point the card back at the
  canonical clone" remedy) while the card was mid retry-cycle, so the next
  spawn landed in the canonical clone, found no such branch there, cut a fresh
  one from HEAD, and Bob reported "the retry workspace/branch is reset to
  aa2b25c and contains none of the previously implemented files or commits".
  The commits were never destroyed — they sat on the same-named branch of the
  other clone, invisible — but the worker, the reviewer and the board all
  behaved as if the implementation had been wiped, and it took a manual
  cherry-pick to recover. The same clone-flip is visible on a sibling card
  five minutes apart (t_5262a7a8: stale clone 17:15:13, canonical 17:20:15).

  Subscribes to `kanban_task_claimed`, which the kernel fires AFTER the claim
  commits and immediately BEFORE the dispatcher resolves and materialises the
  workspace — the last moment at which the branch can be made to exist. It
  fetches the card's branch into the target repo from the clones the card's
  own event history records, or from `origin`, so the kernel's existing-branch
  reuse then checks it out with its commits.

  Deliberately narrow (a control that fires on legitimate cards is worse than
  the defect):
    * worktree cards only, and only when the branch is ABSENT in the target
      repo — a present branch already reuses correctly and is left alone;
    * only for a card with more than one run, so a first provision is never
      touched and still creates from base (regression AC3);
    * the fetch only ever CREATES a missing local ref (`refs/heads/x:refs/heads/x`
      cannot overwrite an existing one) and never touches a working tree,
      index or HEAD;
    * fail-open by construction — any exception, missing DB, unreadable board
      metadata or git failure returns without changing anything.

  kind: backend so it loads in every profile and in the dispatcher.

  1.1.0 (t_2a901db6, the follow-ups to the t_8c1986b6 review — both were ways
  the plugin could be quietly ABSENT):
    * board discovery now mirrors `kanban_home()`: HERMES_KANBAN_HOME else the
      ROOT home, so `HERMES_HOME=<root>/profiles/<name>` resolves BACK to
      `<root>`. Returning HERMES_HOME verbatim made the guard inert in every
      profile-owned dispatcher — it looked for the board inside the profile
      directory and reported "no board db holds this task" for a board it had
      never looked at. brain/switch/axel have each held the machine-global
      dispatcher lease, and non-root ownership is supported on purpose.
    * the remote candidate is ref-only and LOCAL: it is cut from the
      remote-tracking ref `plan()` already proved local, and nothing fetches.
      This hook runs inline under the machine-global dispatch lock, where a
      fetch was up to MAX_SOURCES x GIT_TIMEOUT (80 s) of stall for no gain.
    * events recording `previous_workspace_path` / `old_workspace_path` are
      candidate SOURCES (newest first); they are not target anchors — the target
      still comes from the card's `workspace_path` or the board `default_workdir`.

  Kill switch: HERMES_KANBAN_WORKTREE_CARRYOVER=0 disables it without a revert.

  1.2.0 (P1-base-current, 2026-09-23) — a second, independent phase on the same
  hook, run AFTER carry-over on EVERY claim of a worktree card (first run
  included). `kanban_db_workspace._ensure_git_worktree` cuts a NEW branch with
  `git worktree add -b <branch> <target> HEAD`: the primary clone's parked,
  unfetched HEAD became the base of every new card, and any agent that ran
  `git checkout` in the clone re-based all later cards. The kernel reuses a
  branch that already EXISTS, so this phase makes it exist first:
    * card `branch_name` set and ABSENT in the target repo -> `git branch
      --no-track <branch> refs/remotes/origin/<trunk>` (a plain local ref;
      no fetch, no checkout, HEAD/index/worktrees untouched);
    * branch present -> nothing (a retry keeps its commits);
    * `refs/remotes/origin/<trunk>` missing -> nothing, one WARNING;
    * trunk = tenant `trunk` key in kanban-tenants.json (tenant found by
      realpath-matching `primary_path` to the target repo), else the target
      of `refs/remotes/origin/HEAD`, else `main`;
    * staleness signal only: if `.git/FETCH_HEAD` is older than
      HERMES_BASE_CURRENT_MAX_AGE_MIN (default 30) it logs a WARNING naming
      the repo — `~/.hermes/scripts/base-current-watch.py` (cron, 5 min)
      does the fetching, never this hook (dispatch lock);
    * records a `base_current` task_events row, like carry-over's.
  Kill switch: HERMES_KANBAN_BASE_CURRENT=0 (independent of the carry-over one).
provides_hooks:
  - kanban_task_claimed
