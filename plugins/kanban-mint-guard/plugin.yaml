name: kanban-mint-guard
version: 0.1.0
kind: backend
author: Claude (Cowork) for Richie, 2026-09-12
description: >-
  Mint-time assignee routing guard, as a PLUGIN rather than a core patch.

  Replaces the reverted core change 14dace227 ("C1"), which put this lint inside
  tools/kanban_tools.py and, in doing so, rewrote that file +3891/-1945, silently
  dropped the charter-4 estimation code, and spawned three regression cards. The
  behaviour was wanted; the location was not. Per the 2026-09-09 decision, policy
  lives on upstream's hook surface and upstream's kanban stays the substrate.

  The defect it closes: kanban_create passes `assignee` through verbatim and parks
  only UNKNOWN names, so a real-but-wrong profile is accepted and dispatched.
  Measured 2026-09-12: three mis-routings in one day (a build card to rodge, who
  then heartbeat for 57 minutes doing nothing; a coding card to axel, who timed out
  at 602s; an env card to axel again), against a 7-day baseline of 14.

  kind: backend so it loads in every profile and every kanban worker. A user plugin
  in ~/.hermes/plugins is invisible to workers — that is why the completion gate was
  a silent no-op from 09-09 to 09-11.

  Severity is deliberately split. It BLOCKS only contradictions that cannot be
  legitimate, and leaves everything softer to scripts/fleet-watchdogs/assignee-mismatch-watch.py,
  which flags rather than refuses:
    1. a board-lane card (build / review / verify / deploy verb in the title)
       assigned to axel, switch or brain — none of which is a board lane. Axel is
       WeRoll-business-only per its SOUL; switch is the switchboard; brain takes
       no cards at all.
    2. an explicit owner marker in the title ("[Bob] ...", "Rodge — ...") naming a
       different profile than `assignee`.
    3. a build-lane title assigned to rodge, steve-o or karl — the cross-lane case
       that produced the 57-minute dead run.

  Escape hatch: put `assignee-override:` anywhere in the card body (with the reason)
  and the guard stands down. Legitimate cross-lane cards exist; they should say so.

  A fourth rule (2026-09-16, ladder-20260916) makes the DECLARED extension point a
  control. The ladder — plugin -> watchdog -> skill -> soul -> config, and "if none
  of the five fits, hand it to Richie; a core patch is never the fallback" — was SOUL
  prose only, so a card could declare a seam off the ladder and be dispatched like any
  other. Card t_331cb549 declared `extension-point: config/kernel` and named
  hermes_cli/kanban_db.py as its deliverable; it was created, held, released and
  dispatched, and only the worker's judgement declined the kernel shape. The existing
  kernel rule could not see it: that rule wants a line that STARTS with an edit verb,
  and this body describes the change mid-sentence.

    4. a card body whose own `extension-point:` line names a value outside the five,
       unless the body also carries `core-patch-approved: <who>`.

  Narrow on purpose, exactly like the kernel rule: the marker must be DECLARED on its
  own line, so prose ABOUT the marker ("a card declaring `extension-point: config/kernel`
  is refused") is not read. A quoted placeholder (`<value>`) is documentation, and a
  multi-value form of SANCTIONED rungs (`soul or skill`) is a card still choosing between
  valid rungs — neither is refused. A body with no marker behaves exactly as before.

  A fifth rule (2026-09-16, card t_305e022d) is about the WORKSPACE, not the assignee: a
  `worktree` card is cut from the repo's CURRENT HEAD (`_ensure_git_worktree()` runs
  `git worktree add -b <branch> <target> HEAD`; nothing in the create path takes a base
  ref), so a card whose work must sit on a sibling branch lands in the wrong tree — the
  file it was told to edit is absent, or it edits a branch nobody will merge — and nothing
  errors. Measured 2026-09-16: four cards found by hand (t_75ebec63, t_c827851e,
  t_331cb549, t_d5cdd9f2), one of which re-authored a page from scratch against a premise
  that was false on its own base.

    5. a `worktree` card whose body DECLARES a branch (`Branch: …`, `base: …`,
       `Base branch: …`) or DIRECTS the work onto one ("Work on `…`", "Commit on `…`",
       "lives on `…`") that is not the resolved repo's current HEAD is refused, with the
       remedy in the message: `workspace_kind='dir'` pointed at an existing worktree that
       already carries the branch. `dir` and `scratch` cards are untouched.

  Rule 5 is kept narrow by measurement, not by taste: reading a body for "any existing
  branch name" refuses 90 of the 372 real worktree cards on this board, because `main` is
  also an English word ("<main> element", "do not push to `main`"). Read as declarations
  plus locative directives and replayed through the REAL hook chain, it refuses 44 of those
  372 — 17 against the card's own project repo (three cards committing onto one hand-cut
  branch, six WP5 cards on one consolidated branch, cards based on an unmerged branch), and
  27 whose stored workspace_path names the legacy checkout now parked on `review-wp10`
  while the body declares `main`/`master` (the guard answers about the args it is given, and
  the message names the repo it resolved). The 292 dir and 302 scratch rows replayed: rule 5
  fired on none of them. Its residual false positive is a card that declares the branch it
  will itself create; the remedy is one line of body text and the message says which. Like
  the kernel rule, the prose it cannot classify stays a documented gap — the
  `kanban-worktree-provisioning` skill still carries the manual check.

  Fail-open by construction. No title, no assignee, an unknown name, a body it
  cannot read, or any exception at all -> the card is created. A guard that guesses
  is worse than no guard, and refusing to mint is how a board stops entirely.
