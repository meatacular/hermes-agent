name: review-lane-mint-guard
version: 0.1.0
kind: backend
provides_hooks:
  - pre_tool_call
author: Bob, 2026-09-16
description: >-
  Refuse reviewer-shaped kanban cards at mint time when they would be dispatched
  from ready instead of the review lane. kanban_request_changes requires a
  review_requested handoff and a claim carrying source_status=review; the safe
  route is the same implementation card through kanban_request_review(reviewer=rodge).

  This is a mint-path guard, not a kernel change. It catches the two measured
  standalone review-card occurrences (t_1b0eea20 and archived t_6ea31d1a) before
  a reviewer spends a run. Genuine review-lane cards are not created by
  kanban_create and are therefore untouched.

  The guard is deliberately narrow: only kanban_create, only a reviewer-shaped
  title, and only a reviewer assignee. Ordinary implementation cards and all
  other tools pass through unchanged.
